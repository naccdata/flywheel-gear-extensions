exclude = [
    "comanage"
]

line-length = 88
indent-width = 4

target-version = "py312"

[lint]
select = ["A", "B", "E", "W", "F", "I", "RUF", "SIM", "C90", "PLW0406", "COM818", "SLF001", "E402"]

[lint.per-file-ignores]
# TODO: confirm that this was a yapf/ruff conflict
"common/src/python/curator/scheduling.py" = ["I001"]
"common/src/python/event_capture/visit_event_accumulator.py" = ["I001"]
"common/test/python/event_capture/test_visit_event_accumulator.py" = ["I001"]
"tests/*" = ["SLF001"]

[lint.isort]
# Import grouping (I001) must be stable regardless of the Pants target scope
# ruff runs under. Pants runs ruff in a sandbox that may not contain a monorepo
# package's __init__.py (e.g. file-scoped `pants fix`), so ruff's automatic
# first-party detection can misclassify a local package as third-party and
# regroup its imports; CI then runs ruff at a wider scope and rejects the
# result. Declaring the first-party set explicitly removes the ambiguity.
#
# This follows the canonical Pants approach (see pantsbuild/example-python,
# .isort.cfg): pin known-first-party and let everything else fall through to
# third-party, which is ruff's default section. No known-third-party list is
# needed -- external packages, including the type stubs under mypy-stubs/
# (flywheel, fw_gear), group as third-party by default because they are not
# listed here.
#
# Keep this in sync when gears or packages are added (a missing entry fails
# loud as an I001 on that package). It is the set of top-level package names
# under the src/python and test/python source roots.
#
# Use this command to CHECK for entries this list is missing (not to blindly
# rebuild it) -- diff its output against the list below:
#   { find . -type d \( -path '*/src/python/*' -o -path '*/test/python/*' \) \
#       -maxdepth 6 -not -path '*/.*' -not -path './mypy-stubs/*'; } \
#     | awk -F'/python/' '{print $2}' | awk -F'/' '{print $1}' \
#     | sort -u | grep -v cookiecutter
# Notes on why this is a check, not a generator:
#   - mypy-stubs/ is excluded: the stub packages flywheel and fw_gear must stay
#     third-party (see above); without the exclude the command would emit them.
#   - coreapi_client is generated under comanage/ (pants run comanage:build_client),
#     so the command only finds it after codegen has run; it stays first-party
#     either way.
