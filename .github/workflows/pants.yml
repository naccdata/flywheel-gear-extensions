# Based on
# https://github.com/pantsbuild/example-python/blob/main/.github/workflows/pants.yaml

name: Pants Lint and Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
# Runs on main are not grouped together so each main commit still gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Pants Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - uses: pantsbuild/actions/init-pants@v11
      # This action bootstraps pants and manages 2-3 GHA caches.
      # See: github.com/pantsbuild/actions/tree/main/init-pants/
      with:
        # v0 makes it easy to bust the cache if needed
        # just increase the integer to start with a fresh cache
        gha-cache-key: v0
        # The Python backend uses named_caches for Pip/PEX state,
        # so it is appropriate to invalidate on lockfile changes.
        named-caches-hash: ${{ hashFiles('python-default.lock') }}
        # Preserve the local Pants cache (lmdb_store) between runs so lint/check/test
        # results are reused incrementally instead of recomputed from scratch.
        # The cache falls back to partial restore keys and grows over time; bump
        # gha-cache-key above to reset it if it gets stale or too large.
        cache-lmdb-store: 'true'
        # Note that named_caches and lmdb_store falls back to partial restore keys which
        # may give a useful partial result that will save time over completely clean state,
        # but will cause the cache entry to grow without bound over time.
        # See https://www.pantsbuild.org/2.21/docs/using-pants/using-pants-in-ci for tips on how to periodically clean it up.
        # Alternatively you change gha-cache-key to ignore old caches.
    - name: Check Build
      run: |
        pants update-build-files --check ::
    # Cache the generated CoManage client so we skip the openapi-generator Docker
    # image pull + JVM codegen on every run. The generated output is a function of
    # both the schema (coreapi.yaml) and the generator config/version (comanage/BUILD
    # pins the openapi-generator-cli image tag), so key the cache on both. A generator
    # version bump in BUILD therefore invalidates the cache and forces regeneration.
    - name: Cache CoManage generated client
      id: comanage-cache
      uses: actions/cache@v4
      with:
        path: comanage/coreapi/src/python
        key: comanage-client-${{ hashFiles('comanage/coreapi.yaml', 'comanage/BUILD') }}
    - name: Build CoManage
      if: steps.comanage-cache.outputs.cache-hit != 'true'
      run: |
        pants run comanage:build_client
    - name: Lint
      run: |
        pants lint ::
        pants check ::
    - name: Test
      if: always()
      run: |
        pants test ::

  nacc-common-compat:
    name: nacc-common Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - uses: pantsbuild/actions/init-pants@v11
      with:
        gha-cache-key: v0
        named-caches-hash: ${{ hashFiles('python-default.lock') }}
        cache-lmdb-store: 'true'
    - name: Package nacc-common
      run: |
        pants package nacc-common:dist
    - name: Install and test nacc-common
      run: |
        python -m pip install dist/nacc_common-*.whl
        python -c "import nacc_common; print('nacc_common imported successfully')"
        python -c "from nacc_common.error_models import FileQCModel, FileError; print('error_models OK')"
        python -c "from nacc_common.form_dates import convert_date, parse_date; print('form_dates OK')"
        python -c "from nacc_common.pipeline import get_project; print('pipeline OK')"
        python -c "from nacc_common.center_info import get_center_id; print('center_info OK')"
